<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore the designs of 86 replication studies in visualisation with REPVIS2.">
  <title>REPVIS2 · Replication studies</title><link rel="stylesheet" href="styles.css?v=20260917-2">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#profiles">REPVIS<span>2</span></a>
    <nav class="tabs" aria-label="Project pages">
      <button type="button" class="tab is-active" data-tab="profiles" aria-selected="true">Explore the corpus</button>
      <button type="button" class="tab" data-tab="s1" aria-selected="false"><span>Supplementary Material 1:</span><span class="tab-subtitle">Coding guide and codebooks</span></button>
      <button type="button" class="tab" data-tab="s2" aria-selected="false"><span>Supplementary Material 2:</span><span class="tab-subtitle">Search, corpus registry and coding results</span></button>
    </nav>
  </header>
  <main>
    <section id="profiles" class="panel is-active" aria-label="Explore replication designs">
      <div class="toolbar" aria-label="Filter studies">
        <label class="search-field"><span>Find a paper</span><input id="search" type="search" placeholder="Author, title or study ID…" autocomplete="off"></label>
        <label><span>Motivation</span><select id="motivation"><option value="">All motivations</option></select></label>
        <label><span>Replication result</span><select id="result"><option value="">All results</option><option value="Consistent">Consistent</option><option value="Partly consistent">Partly consistent</option><option value="Not consistent">Not consistent</option></select></label>
        <label><span>Research team</span><select id="team"><option value="">Either</option><option value="overlap">Overlap</option><option value="independent">Independent</option></select></label>
        <button id="reset" class="quiet-button" type="button">Reset</button>
      </div>
      <div class="explorer">
        <section class="chart-card" aria-label="Corpus profiles">
          <div class="chart-toolbar"><span id="match-count" role="status">86 studies · 51 papers</span><div class="legend" aria-label="Filter by reported result"><span class="legend-title">Reported result</span><button type="button" data-result="Consistent" aria-pressed="false"><i style="--swatch:#4477aa"></i>Consistent</button><button type="button" data-result="Partly consistent" aria-pressed="false"><i style="--swatch:#aa8833"></i>Partly consistent</button><button type="button" data-result="Not consistent" aria-pressed="false"><i style="--swatch:#aa4455"></i>Not consistent</button></div></div>
          <div class="dimension-filter"><label for="dimension">Dimension</label><select id="dimension"><option value="">Any dimension</option></select><label class="sr-only" for="level">Comparison level</label><select id="level" disabled><option value="">Any level</option><option value="identical">Identical</option><option value="similar">Similar</option><option value="different">Different</option><option value="N/A">N/A</option></select><button id="expand-chart" type="button" class="quiet-button">Expand chart</button></div>
          <div id="chart-scroll" class="chart-scroll"><svg id="profile-chart" role="group" aria-label="Parallel coordinates of replication designs"></svg><p id="no-matches" hidden>No studies match these filters. Remove a filter or select Reset.</p></div>
          <div class="chart-footer"><span id="selection-caption">Hover to preview · Click to keep a selection</span><button id="clear-selection" type="button" class="text-button" disabled>Clear selection</button></div>
        </section>
        <aside class="inspector" aria-label="Study details and REPVIS2 design space">
          <div class="inspector-heading"><h2>Study &amp; design space</h2><span id="selection-mode">Overview</span></div>
          <div class="inspector-scroll">
            <div id="study-overview"></div>
            <section class="map-section" aria-label="REPVIS2 map">
              <div class="section-heading"><h3>Where this fits in REPVIS2</h3><div class="map-actions"><button id="enlarge-map" type="button" class="text-button">Enlarge</button><a id="download-map" class="text-button" href="assets/REPVIS2-design-space.pdf" download="REPVIS2-design-space.pdf">Download</a></div></div>
              <div class="design-map"><img src="assets/design-space.png" alt="REPVIS2: research team; eight dimensions with identical, similar and different levels and design changes; an additional-question layer for design additions."><button type="button" class="map-region region-team" data-block="team" aria-label="Research team" title="Research team"></button><button type="button" class="map-region region-levels" data-block="levels" aria-label="Comparison dimensions and levels" title="Comparison dimensions and levels"></button><button type="button" class="map-region region-changes" data-block="changes" aria-label="Design changes" title="Design changes"></button><button type="button" class="map-region region-additions" data-block="additions" aria-label="Design additions" title="Design additions"></button></div>
              <p class="map-hint">Choose a broad region to read its details.</p>
            </section>
            <nav class="block-tabs" aria-label="Design detail sections"><button type="button" data-block="team" aria-pressed="false">Team</button><button type="button" data-block="levels" aria-pressed="true">Dimensions</button><button type="button" data-block="changes" aria-pressed="false">Changes</button><button type="button" data-block="additions" aria-pressed="false">Additions</button></nav>
            <section id="block-detail" aria-label="Selected design region"></section>
          </div>
        </aside>
      </div>
    </section>
    <section id="s1" class="panel document-panel" aria-label="Supplementary Material 1"><iframe title="Supplementary Material 1: Coding guide and codebooks" src="assets/S1.pdf#view=FitH"></iframe></section>
    <section id="s2" class="panel document-panel" aria-label="Supplementary Material 2"><iframe title="Supplementary Material 2: Search, corpus registry and coding results" src="assets/S2.pdf#view=FitH"></iframe></section>
  </main>
  <div id="tooltip" class="tooltip" hidden></div>
  <dialog id="map-dialog"><div class="section-heading"><h2>The REPVIS2 design space</h2><button id="close-map" type="button" class="quiet-button">Close</button></div><img src="assets/design-space.png" alt="Full REPVIS2 design space diagram"></dialog>
  <script src="data/studies.js"></script><script src="data/details.js"></script><script src="app.js?v=20260917-2"></script>
</body>
</html>
